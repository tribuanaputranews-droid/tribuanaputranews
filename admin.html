<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kelola Berita & Konten</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; }
        
        /* Modal Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h2 { margin-bottom: 20px; color: #2c3e50; }
        .login-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-card button {
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Layout Admin */
        header { background: #2c3e50; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background: #2980b9; color: #fff; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-logout { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Modal Login Layar Penuh -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>🔑 Login Admin</h2>
            <form id="form-login-admin" onsubmit="window.prosesLoginAdmin(event)">
                <input type="email" id="admin_email" placeholder="Email Admin" required>
                <input type="password" id="admin_password" placeholder="Password" required>
                <button type="submit">Masuk Ke Panel Admin</button>
            </form>
            <p id="login-error" style="color: red; font-size: 13px; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <!-- Dashboard Admin (Hanya Tampil Jika Sudah Login) -->
    <div id="admin-dashboard" style="display: none;">
        <header>
            <h2>Panel Admin Portal Berita</h2>
            <div>
                <span id="user-email-display" style="margin-right: 15px; font-size: 14px;"></span>
                <button class="btn-logout" onclick="window.prosesLogoutAdmin()">Keluar (Logout)</button>
            </div>
        </header>

        <div class="container">
            <h3>📝 Input Artikel Berita Baru</h3>
            <hr style="margin: 15px 0;">
            <form id="form-berita" onsubmit="window.simpanBerita(event)">
                <div class="form-group">
                    <label>Judul Berita</label>
                    <input type="text" id="berita_judul" required>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="berita_kategori">
                        <option value="Nasional">Nasional</option>
                        <option value="Kabupaten">Kabupaten</option>
                        <option value="Kecamatan">Kecamatan</option>
                        <option value="Desa">Desa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Isi Berita (HTML Didukung)</label>
                    <textarea id="berita_isi" rows="8" placeholder="Gunakan tag HTML jika memasukkan gambar, e.g. <img src='url_gambar'>" required></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="berita_utama"> Bikin Jadi Berita Utama (Slider)
                    </label>
                </div>
                <button type="submit" class="btn-submit">🔒 Publikasikan Berita</button>
            </form>
        </div>
    </div>

    <!-- Firebase Auth & Firestore SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // Konfigurasi Firebase (Harus sama dengan index.html)
const firebaseConfig = {
  apiKey: "AIzaSyCc1rUgdchrZ8vxk3HF6-yQKMZze-dNwzE",
  authDomain: "tribuanaputra-1968.firebaseapp.com",
  databaseURL: "https://tribuanaputra-1968-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tribuanaputra-1968",
  storageBucket: "tribuanaputra-1968.firebasestorage.app",
  messagingSenderId: "772922168211",
  appId: "1:772922168211:web:5bb280501e3d3e6fc50e66",
  measurementId: "G-5Z8E2GWDHZ"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cek Status Autentikasi Pengguna
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('user-email-display').innerText = user.email;
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
                document.getElementById('admin-dashboard').style.display = 'none';
            }
        });

        // Handler Login Admin
        window.prosesLoginAdmin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('admin_email').value;
            const password = document.getElementById('admin_password').value;
            const errBox = document.getElementById('login-error');

            try {
                errBox.style.display = 'none';
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                errBox.style.display = 'block';
                errBox.innerText = "Login Gagal: " + err.message;
            }
        }

        // Handler Logout
        window.prosesLogoutAdmin = function() {
            signOut(auth);
        }

        // Handler Simpan Berita
        window.simpanBerita = async function(e) {
            e.preventDefault();
            let judul = document.getElementById('berita_judul').value;
            let kategori = document.getElementById('berita_kategori').value;
            let isi = document.getElementById('berita_isi').value;
            let isUtama = document.getElementById('berita_utama').checked;
            let tgl = new Date().toLocaleDateString('id-ID');

            try {
                await addDoc(collection(db, "berita"), {
                    judul: judul,
                    kategori: kategori,
                    isiBerita: isi,
                    beritaUtama: isUtama,
                    tglPublish: tgl,
                    viewer: 0,
                    tampilkanDiWeb: true,
                    created_at: Date.now()
                });
                alert("✅ Berita berhasil diunggah!");
                document.getElementById('form-berita').reset();
            } catch (err) {
                alert("Gagal mengunggah berita: " + err.message);
            }
        }
    </script>
</body>
</html>
