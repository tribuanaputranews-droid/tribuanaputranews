<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribuana Putra News</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f4f4; color: #333; }

        /* === HEADER === */
        header {
            background: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 { font-size: 22px; }

        /* === MENU === */
        nav {
            background: #34495e;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            margin: 0 10px;
            text-decoration: none;
        }

        /* === RUNNING TEXT === */
        .running {
            background: #f1c40f;
            padding: 8px;
            overflow: hidden;
            white-space: nowrap;
        }
        .run-text {
            display: inline-block;
            animation: geser 20s linear infinite;
        }
        @keyframes geser {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        /* === KONTEN === */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        h2 {
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #2c3e50;
        }

        /* === DAFTAR BERITA === */
        .news-item {
            background: #fff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .news-item:hover { background: #f9f9f9; }
        .news-item h3 { margin-bottom: 5px; color: #2c3e50; }
        .date { font-size: 13px; color: #888; margin-bottom: 8px; }
        .excerpt { color: #555; }

        /* === BACA BERITA === */
        .full-news {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }
        .full-news.show { display: block; }
        .back {
            color: #2980b9;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
        }
        .full-news h2 { border: none; padding: 0; }
        .full-img { max-width: 100%; margin: 15px 0; border-radius: 5px; }
        .content { line-height: 1.8; margin-top: 15px; }

        /* === FOOTER === */
        footer {
            background: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>Tribuana Putra News</h1>
    <p>Portal Berita — Wilayah Priangan Timur</p>
</header>

<nav>
    <a href="#" onclick="showList()">Beranda</a>
    <a href="admin.html">Admin</a>
</nav>

<div class="running">
    <span class="run-text" id="run-text">Memuat pengumuman...</span>
</div>

<div class="container">
    <!-- DAFTAR BERITA -->
    <div id="list-section">
        <h2>Berita Terbaru</h2>
        <div id="news-list">
            <p>Memuat berita...</p>
        </div>
    </div>

    <!-- BACA BERITA PENUH -->
    <div class="full-news" id="full-section">
        <span class="back" onclick="showList()">← Kembali ke daftar</span>
        <h2 id="full-title"></h2>
        <p class="date" id="full-date"></p>
        <img id="full-img" class="full-img" style="display:none;">
        <div id="full-content" class="content"></div>
    </div>
</div>

<footer>
    <p>&copy; 2026 Tribuana Putra News — Semua Hak Dilindungi</p>
</footer>

<script>
// === FIREBASE KONFIGURASI ===
const firebaseConfig = {
    apiKey: "AIzaSyB9S_WQPGai5H3wEVHVWqBlGTWo6lFCFmA",
    authDomain: "tribuanaputranews-1968-f7677.firebaseapp.com",
    databaseURL: "https://tribuanaputranews-1968-f7677-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tribuanaputranews-1968-f7677",
    storageBucket: "tribuanaputranews-1968-f7677.appspot.com",
    messagingSenderId: "1074526389402",
    appId: "1:1074526389402:web:4b5c5e5f6a7b8c9d0e1f2a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let newsData = [];

// === SAAT HALAMAN DIBUKA ===
document.addEventListener('DOMContentLoaded', async function() {
    await loadRunningText();
    await loadNews();
});

// === RUNNING TEXT ===
async function loadRunningText() {
    const snap = await db.ref('pengaturan/pengumuman').once('value');
    const data = snap.val();
    if (Array.isArray(data) && data.length > 0) {
        document.getElementById('run-text').textContent = data.map(item => item.teks).join('   📰   ');
    } else {
        document.getElementById('run-text').textContent = 'Selamat datang di Tribuana Putra News';
    }
}

// === MUAT BERITA DARI FIREBASE ===
async function loadNews() {
    const snap = await db.ref('berita').orderByChild('dibuatPada').once('value');
    const all = snap.val() || {};
    newsData = Object.entries(all).map(([id, b]) => ({ id, ...b })).reverse();
    renderList();
}

// === TAMPIL DAFTAR ===
function renderList() {
    const list = document.getElementById('news-list');
    if (newsData.length === 0) {
        list.innerHTML = '<p style="color:#777;">Belum ada berita. Silakan tulis di halaman Admin.</p>';
        return;
    }
    list.innerHTML = newsData.map(b => `
        <div class="news-item" onclick="openNews('${b.id}')">
            <h3>${b.judul}</h3>
            <p class="date">📅 ${b.tglPublish || '-'}</p>
            <p class="excerpt">${(b.isiBerita || '').replace(/<[^>]+>/g, '').slice(0, 100)}...</p>
        </div>
    `).join('');
}

// === KEMBALI KE DAFTAR ===
function showList() {
    document.getElementById('list-section').style.display = 'block';
    document.getElementById('full-section').classList.remove('show');
}

// === BUKA BERITA PENUH ===
function openNews(id) {
    const b = newsData.find(item => item.id === id);
    if (!b) return;
    
    document.getElementById('list-section').style.display = 'none';
    document.getElementById('full-section').classList.add('show');
    
    document.getElementById('full-title').textContent = b.judul;
    document.getElementById('full-date').textContent = `📅 ${b.tglPublish || '-'} ${b.jamPublish || ''}`;
    
    const img = document.getElementById('full-img');
    if (b.gambarUtama) {
        img.src = b.gambarUtama;
        img.style.display = 'block';
    } else {
        img.style.display = 'none';
    }
    
    document.getElementById('full-content').innerHTML = b.isiBerita || '<p>Isi berita belum tersedia.</p>';
    window.scrollTo(0, 0);
}
</script>
</body>
</html>
